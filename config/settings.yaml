# Jumpchain Engine Configuration

# LLM Endpoints - Three-Tier Architecture
# User-orchestrated: Choose the right model for the depth you want

llm_endpoints:
  # Tier 1: LOCAL FAST (GLM 4.5 Air via LM Studio)
  # Use for: Quick processing, routine calculations, fast responses
  local_fast:
    model: "glm-4-air"
    endpoint: "http://localhost:1234/v1/chat/completions"  # LM Studio default
    api_key: ""  # Not needed for local
    purpose: "Fast local processing - calculations, quick turns"
    cost_per_1m_tokens: 0.0

  # Tier 2: ANALYTICAL (GLM 4.6 via OpenRouter)
  # Use for: Complex analysis, strategic thinking, companion AI
  analytical:
    model: "google/glm-4-plus"  # OpenRouter model ID
    endpoint: "https://openrouter.ai/api/v1/chat/completions"
    api_key: ""  # Set via OPENROUTER_API_KEY environment variable
    purpose: "Complex analysis, strategy, world building"
    cost_per_1m_tokens: 2.0  # $2/1M tokens

  # Tier 3: MASTER NARRATOR (Claude Sonnet 4.5 - The Big Guns)
  # Use for: Deep storytelling, shadow work, transformative moments
  master_narrator:
    model: "claude-sonnet-4-5"
    endpoint: "https://api.anthropic.com/v1/messages"
    api_key: ""  # Set via ANTHROPIC_API_KEY environment variable
    purpose: "Beautiful narration, psychological depth, shadow work"
    cost_per_1m_tokens: 3.0  # $3/1M input tokens

# Database Configuration
database:
  path: "data/jumpchain.db"
  backup_interval: 10  # Create backup every N turns
  auto_backup: true

# Gameplay Settings
gameplay:
  tone: "serious_comedy"  # Options: serious_comedy, dark, heroic, absurdist
  auto_save: true
  difficulty: "balanced"  # Options: easy, balanced, hard, brutal

  # Turn settings
  days_per_turn: 1

  # CP settings
  base_cp: 1000
  companion_cp: 600

# Reward System Configuration
rewards:
  bronze_multiplier: 1.05  # +5% CP
  silver_multiplier: 1.10  # +10% CP
  gold_multiplier: 1.25    # +25% CP
  platinum_multiplier: 1.50  # +50% CP

  # Achievement tracking
  track_speedruns: true
  track_synergies: true
  track_perfect_runs: true

# Narration Settings
narration:
  max_length_words: 500
  include_companion_dialogue: true
  show_mechanics: false  # Hide dice rolls/calculations from player
  hint_at_background: true  # Include subtle hints about off-screen events
  style:
    - "Serious competence with comedic undertones"
    - "Highlight synergy uses"
    - "Show 'speedrunner glitch' moments when using precog perks"

# Background Simulation Settings
background_simulation:
  enabled: true
  events_per_turn: 2  # Average number of background events
  crisis_chance: 0.05  # 5% chance of crisis per turn
  opportunity_chance: 0.10  # 10% chance of opportunity per turn

# Companion AI Settings
companion_ai:
  enabled: true
  autonomous_actions: true  # Companions can initiate actions
  relationship_evolution: true
  memory_depth: 20  # Remember last N events

# World Building Settings
world_building:
  auto_populate: true
  wiki_scraping: true
  timeline_generation: true

# UI Settings
ui:
  interface: "cli"  # Options: cli, web
  colors: true
  animations: false

# Debug Settings
debug:
  verbose_logging: false
  show_llm_prompts: false
  show_calculation_details: false
